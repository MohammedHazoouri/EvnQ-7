<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b22">
  <title>A Night Written in Stars</title>
  <meta name="description" content="A cinematic wedding invitation — A Night Written in Stars.">
  <link rel="icon" type="image/png" href="../shared/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">

  <!-- Reusable SVG art -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6e3a1"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#a8801c"/>
      </linearGradient>

      <symbol id="flower" viewBox="-20 -20 40 40">
        <g fill="#f4dcd4" stroke="#d4af37" stroke-width=".6">
          <ellipse cx="0" cy="-9" rx="5" ry="9"/>
          <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(72)"/>
          <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(144)"/>
          <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(216)"/>
          <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(288)"/>
        </g>
        <circle r="3.2" fill="#d4af37"/><circle r="1.2" fill="#fff3c4"/>
      </symbol>

      <symbol id="leaf" viewBox="0 0 40 20">
        <path d="M0 10 Q20 -6 40 10 Q20 26 0 10Z" fill="#a9b98a" stroke="#d4af37" stroke-width=".6"/>
        <path d="M2 10 H38" stroke="#d4af37" stroke-width=".5" fill="none"/>
      </symbol>

      <symbol id="garland" viewBox="0 0 600 120">
        <path d="M10 92 C140 20 250 112 300 62 C350 112 460 20 590 92" fill="none" stroke="url(#goldG)" stroke-width="2.2" stroke-linecap="round"/>
        <use href="#leaf" x="60" y="52" width="46" height="23" transform="rotate(-24 83 63)"/>
        <use href="#leaf" x="118" y="38" width="46" height="23" transform="rotate(-8 141 49)"/>
        <use href="#leaf" x="190" y="56" width="46" height="23" transform="rotate(26 213 67)"/>
        <use href="#leaf" x="364" y="56" width="46" height="23" transform="rotate(-26 387 67)"/>
        <use href="#leaf" x="436" y="38" width="46" height="23" transform="rotate(8 459 49)"/>
        <use href="#leaf" x="494" y="52" width="46" height="23" transform="rotate(24 517 63)"/>
        <use href="#flower" x="276" y="26" width="48" height="48"/>
        <use href="#flower" x="172" y="62" width="34" height="34"/>
        <use href="#flower" x="394" y="62" width="34" height="34"/>
        <use href="#flower" x="92" y="44" width="28" height="28"/>
        <use href="#flower" x="480" y="44" width="28" height="28"/>
      </symbol>

      <symbol id="corner" viewBox="0 0 100 100">
        <path d="M3 97 V22 Q3 3 22 3 H97" fill="none" stroke="url(#goldG)" stroke-width="2.4"/>
        <path d="M12 97 V30 Q12 12 30 12 H97" fill="none" stroke="#d4af37" stroke-width=".9" opacity=".7"/>
        <path d="M26 26 q22 0 22 22 q0 14 -14 14 q-10 0 -10 -9" fill="none" stroke="url(#goldG)" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="26" cy="26" r="3" fill="#d4af37"/>
      </symbol>

      <symbol id="flourish" viewBox="0 0 300 24">
        <path d="M0 12 H118 M182 12 H300" stroke="url(#goldG)" stroke-width="1.2"/>
        <path d="M150 3 L158 12 L150 21 L142 12Z" fill="url(#goldG)"/>
        <circle cx="128" cy="12" r="2.4" fill="#d4af37"/><circle cx="172" cy="12" r="2.4" fill="#d4af37"/>
      </symbol>

      <symbol id="spark" viewBox="-10 -10 20 20">
        <path d="M0 -10 Q1 -1 10 0 Q1 1 0 10 Q-1 1 -10 0 Q-1 -1 0 -10Z" fill="#f6e3a1"/>
      </symbol>
    </defs>
  </svg>

  <div class="moon" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- SCENE 1 — OPENING -->
  <main id="intro" class="intro" aria-label="Opening scene">
    <p class="intro-label">A Night Written in Stars</p>
    <div class="intro-content">
      <p id="mystery" class="mystery" data-bind="mystery"></p>
      <button id="discover" class="btn-gold pulse" type="button">Discover the Story</button>
    </div>
  </main>

  <!-- SCENE 2 — LIGHT WAVE -->
  <div id="wave" class="wave" aria-hidden="true"></div>

  <!-- SCENE 3 — THE INVITATION -->
  <div id="invite" class="invite hidden">
    <div class="cords" aria-hidden="true">
      <svg viewBox="0 0 200 120" preserveAspectRatio="none">
        <path d="M100 4 L30 118" stroke="url(#goldG)" stroke-width="1.5" fill="none"/>
        <path d="M100 4 L170 118" stroke="url(#goldG)" stroke-width="1.5" fill="none"/>
        <circle cx="100" cy="6" r="5" fill="url(#goldG)"/>
      </svg>
    </div>

    <article class="frame">
      <span class="corner tl" aria-hidden="true"><svg><use href="#corner"/></svg></span>
      <span class="corner tr" aria-hidden="true"><svg><use href="#corner"/></svg></span>
      <span class="corner bl" aria-hidden="true"><svg><use href="#corner"/></svg></span>
      <span class="corner br" aria-hidden="true"><svg><use href="#corner"/></svg></span>

      <header class="hero">
        <svg class="garland reveal r-zoom" aria-hidden="true" viewBox="0 0 600 120"><use href="#garland"/></svg>
        <p class="kicker reveal r-up" data-bind="kicker"></p>
        <p class="lead reveal r-up" data-bind="lead"></p>
        <h1 class="names reveal r-zoom" aria-label="">
          <span class="name n1" data-bind="bride"></span>
          <span class="amp" aria-hidden="true">&amp;</span>
          <span class="name n2" data-bind="groom"></span>
        </h1>
        <svg class="divider reveal r-zoom" aria-hidden="true" viewBox="0 0 300 24"><use href="#flourish"/></svg>
        <p class="sub reveal r-up" data-bind="subtitle"></p>
      </header>

      <section class="details" aria-label="Wedding details">
        <div class="card shine reveal r-left">
          <span class="ico ico-cal" aria-hidden="true">
            <svg viewBox="0 0 48 48"><rect x="7" y="10" width="34" height="31" rx="5"/><path d="M7 20H41M16 6V14M32 6V14"/><circle cx="24" cy="30" r="3.2" class="fill"/></svg>
          </span>
          <h2>The Day</h2>
          <p class="big" data-bind="weekday"></p>
          <p class="mid" data-bind="dateLong"></p>
        </div>

        <div class="card shine reveal r-right">
          <span class="ico ico-clock" aria-hidden="true">
            <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path class="hand h1" d="M24 24V13"/><path class="hand h2" d="M24 24L32 28"/></svg>
          </span>
          <h2>The Hour</h2>
          <p class="big" data-bind="time"></p>
          <p class="mid" data-bind="detailsNote"></p>
        </div>

        <div class="card card-wide shine reveal r-up">
          <span class="ico ico-pin" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M24 43C15 31 10 25 10 18a14 14 0 0 1 28 0c0 7-5 13-14 25Z"/><circle cx="24" cy="18" r="5" class="fill"/></svg>
          </span>
          <h2>The Place</h2>
          <p class="big" data-bind="venue"></p>
          <p class="mid" data-bind="address"></p>
          <div class="actions">
            <a id="mapBtn" class="btn-solid shine" href="#" target="_blank" rel="noopener noreferrer">Open on the map</a>
            <button id="calBtn" class="btn-line shine" type="button">Add to calendar</button>
            <a id="gcalBtn" class="link-small" href="#" target="_blank" rel="noopener noreferrer">Google Calendar</a>
          </div>
        </div>

        <div class="card card-wide welcome shine reveal r-flip">
          <h2>Our Welcome</h2>
          <p class="mid quote" data-bind="welcome"></p>
        </div>
      </section>

      <section class="count reveal r-up" aria-label="Countdown">
        <h2 class="count-title" data-bind="countdownTitle"></h2>
        <div id="cdBox" class="cd" role="timer" aria-live="off">
          <div class="cd-cell"><b id="cd-d">00</b><span>Days</span></div>
          <div class="cd-cell"><b id="cd-h">00</b><span>Hours</span></div>
          <div class="cd-cell"><b id="cd-m">00</b><span>Minutes</span></div>
          <div class="cd-cell"><b id="cd-s">00</b><span>Seconds</span></div>
        </div>
        <p id="cdDone" class="cd-done" hidden data-bind="celebration"></p>
      </section>

      <footer class="finale">
        <div class="rings reveal r-zoom" aria-hidden="true">
          <svg viewBox="0 0 260 150">
            <circle class="ring r1" cx="102" cy="82" r="48"/>
            <circle class="ring r2" cx="158" cy="82" r="48"/>
            <path class="gem" d="M102 26 L110 18 L102 10 L94 18Z"/>
            <use class="sp s1" href="#spark" x="30"  y="22"  width="16" height="16"/>
            <use class="sp s2" href="#spark" x="212" y="30"  width="12" height="12"/>
            <use class="sp s3" href="#spark" x="236" y="96"  width="14" height="14"/>
            <use class="sp s4" href="#spark" x="14"  y="100" width="12" height="12"/>
            <use class="sp s5" href="#spark" x="124" y="4"   width="18" height="18"/>
            <use class="sp s6" href="#spark" x="124" y="128" width="12" height="12"/>
            <use class="sp s7" href="#spark" x="56"  y="130" width="10" height="10"/>
            <use class="sp s8" href="#spark" x="192" y="126" width="10" height="10"/>
          </svg>
        </div>
        <p class="closing reveal r-up" data-bind="closing"></p>
        <svg class="divider reveal r-zoom" aria-hidden="true" viewBox="0 0 300 24"><use href="#flourish"/></svg>
        <p class="signature reveal r-up" data-bind="couple"></p>
      </footer>
    </article>
  </div>

  <button id="musicBtn" class="music" type="button" aria-pressed="false" aria-label="Turn music on or off" title="Music">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="../shared/watermark.js"></script>
</body>
</html>
